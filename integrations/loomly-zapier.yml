name: Loomly Zapier Integration Surface
description: >-
  Zapier is the only place Loomly's platform capabilities are published as named,
  callable operations. Loomly ships no first-party API reference, so this listing
  is the de-facto public contract for what an integrator can read from and write
  to. Triggers are event subscriptions (REST-hook style) and actions are writes.
  Everything below is transcribed verbatim from the Zapier listing; nothing is
  inferred.
surface:
  platform: Zapier
  listing: https://zapier.com/apps/loomly/integrations
  auth: OAuth 2.0 authorization code via https://app.loomly.com/oauth/authorize
  first_party: unknown
  note: >-
    The Zapier listing does not state whether the app is built by Loomly or by
    Zapier. Loomly's own help center documents it as "our Zapier integration",
    which is the strongest available signal, but is not a build attribution.
