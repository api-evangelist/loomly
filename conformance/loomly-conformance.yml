  API-technical row below is a measured absence rather than a derived claim.
standards:
  - id: oauth2
    conforms: true
    confidence: medium
    evidence: >-
      A routed OAuth 2.0 authorization-code endpoint responds at
      https://app.loomly.com/oauth/authorize (302 to sign-in), and Loomly's own
      help articles describe a Zapier authorize-and-consent flow. No RFC 6749
      conformance statement is published.
  - id: rfc8414
    name: OAuth 2.0 Authorization Server Metadata
    conforms: false
    evidence: >-
      /.well-known/oauth-authorization-server returns 404 on www.loomly.com and
      app.loomly.com.
  - id: oidc
    conforms: false
    evidence: /.well-known/openid-configuration returns 404 on all Loomly hosts.
  - id: openapi
    conforms: false
    evidence: >-
      No OpenAPI/Swagger document found at /openapi.json, /openapi.yaml,
      /swagger.json, /api-docs or /api/openapi.json on www.loomly.com,
      app.loomly.com, status.loomly.com or loomly.com (all 404), and
      api.loomly.com does not resolve.
  - id: asyncapi
    conforms: false
    evidence: No AsyncAPI document and no first-party webhook reference published.
  - id: rfc9457
    name: Problem Details for HTTP APIs
    conforms: false
