name: Loomly Product Updates
description: >-
  Loomly publishes no API changelog and no release notes on its own domain
  (/changelog, /release-notes, /whats-new and /product-updates all return 404).
  The nearest thing is a "New features" section in its Zendesk help center, where
  each new capability gets a dated article. That is a product changelog, not an
  API changelog — no entry describes an interface change, a version, or a
  breaking change.
