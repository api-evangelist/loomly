aid: loomly
name: Loomly
description: >-
  Loomly is a social media management and brand success platform for planning,
  creating, approving, scheduling and publishing content across Facebook,
  Instagram, LinkedIn, TikTok, YouTube, Pinterest, Snapchat, Threads, Bluesky and
  Google Business Profile, with collaboration and approval workflows, a content
  library, analytics and a community-management inbox. Loomly publishes no public
  developer API, API reference or machine-readable specification. Its only
  programmable surfaces are a partner-gated platform API reached through the
  Loomly Zapier app (12 triggers, 2 actions) over an OAuth 2.0 authorization flow
  at app.loomly.com, and a public read-only status API on status.loomly.com
  operated by SorryApp. Loomly was acquired by Bending Spoons on 2 January 2025.
