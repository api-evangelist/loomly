  - id: pci-dss
    conforms: true
    scope: merchant
    evidence: >-
      Loomly states it is PCI-DSS compliant as a card-not-present merchant;
      cardholder data is handled by Stripe.
  - id: soc2
    conforms: false
    evidence: >-
