      No error reference published; the status API returns plain JSON envelopes
      with no application/problem+json media type.
  - id: rfc9116
    name: security.txt
    conforms: false
    evidence: /.well-known/security.txt returns 404 on all Loomly hosts.
  - id: rfc8594
    name: Sunset HTTP Header
    conforms: false
    evidence: No deprecation or sunset policy published.
  - id: pagination
    conforms: true
    confidence: high
    evidence: >-
      The status API returns a meta object with count and total_count and a
      links.next href on collection endpoints (observed on
      https://status.loomly.com/api/v1/components).
  - id: idempotency
    conforms: false
    evidence: >-
      No Idempotency-Key header, retry-safety guidance or idempotency
