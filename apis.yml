apis:
  - aid: loomly:loomly-status-api
    name: Loomly Status API
    description: >-
      Public, read-only, unauthenticated JSON API for the Loomly status page,
      exposing overall system state, the four service components (Publishing,
      Analytics, Interactions, Website) and paginated incident and maintenance
      notices. The status page and its API are operated for Loomly by SorryApp
      on the status.loomly.com subdomain; the endpoint shapes are SorryApp's
      status-page API, and the data is Loomly's.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://status.loomly.com
    baseURL: https://status.loomly.com/api/v1
    tags:
      - Status
      - Incidents
      - Uptime
      - Monitoring
    properties:
      - type: Documentation
        url: https://api.sorryapp.com/v1
      - type: RateLimits
        url: rate-limits/loomly-rate-limits.yml
      - type: Conventions
        url: conventions/loomly-conventions.yml
  - aid: loomly:loomly-platform-api
    name: Loomly Platform API (partner-gated)
    description: >-
      Loomly operates an OAuth 2.0 protected platform API that backs its Zapier
      app — 12 triggers (new post, post state updated, post publish
      successful/failed/required, new comment, new quick post, new custom post
      idea, item added to library, invite sent, post assignment updated, post
      edited) and 2 write actions (create custom post idea, create quick post).
      No base URL, reference, or specification for this API is published
      anywhere; the only publicly reachable part of it is the authorization
      endpoint at https://app.loomly.com/oauth/authorize, which 302s to sign-in.
      baseURL is deliberately omitted because Loomly does not publish one.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://zapier.com/apps/loomly/integrations
    tags:
      - Posts
      - Content Calendar
      - Scheduling
      - Approval Workflows
      - Partner API
    properties:
      - type: Authentication
        url: authentication/loomly-authentication.yml
      - type: Integrations
        url: integrations/loomly-zapier.yml
